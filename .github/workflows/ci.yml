name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "client/**"
      - "scripts/ui-lint.py"
      - "scripts/e2e-smoke.py"
      - "biome.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"

jobs:
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Warnings fail too: an unused import or variable left behind is how dead code piles up.
      - run: bun run lint -- --error-on-warnings
      - run: bun run test
      # Known advisories in what the server ships with. Moderate and low ones are listed in the log but do not block:
      # they sit deep in firebase-admin's tree and are fixed by its next release, not by a change here.
      - name: No high or critical advisory in the dependencies
        run: bun audit --audit-level=high
      - name: App and server carry the same version
        run: bun ../scripts/check-versions.ts

  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run check
      # DESIGN.md: spacing on the 4px scale, px between blocks, z-index through tokens. The same check as before a commit.
      - name: Styles follow DESIGN.md
        run: python3 ../scripts/ui-lint.py
      - run: bun run test
      - run: bun run build
      - name: No high or critical advisory in the dependencies
        run: bun audit --audit-level=high

  # The main flows in a real browser (first screen, send, retry notice, phone settings). See scripts/e2e-smoke.py.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PLAYWRIGHT_VERSION: "1.63.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
        working-directory: server
      - run: bun install --frozen-lockfile
        working-directory: client
      - run: bun run build
        working-directory: client
      - name: Install Playwright and Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "playwright==$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/venv/bin/playwright" install --with-deps chromium
      - name: Screen smoke test
        env:
          E2E_OUT: ${{ runner.temp }}/e2e-out
        run: '"$RUNNER_TEMP/venv/bin/python" scripts/e2e-smoke.py'
      - name: Screenshots and logs of the failed step
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure
          path: ${{ runner.temp }}/e2e-out
          if-no-files-found: ignore
          retention-days: 7
