version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot proposes the newer ones as reviewable pull requests.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /server
    schedule:
      interval: monthly
    groups:
      server-deps:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /client
    schedule:
      interval: monthly
    groups:
      client-deps:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /client/src-tauri
    schedule:
      interval: monthly
    groups:
      rust-deps:
        patterns: ["*"]
