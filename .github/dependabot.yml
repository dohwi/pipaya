version: 2
updates:
  # Workflow actions are pinned to commit SHAs; Dependabot proposes the newer ones as reviewable pull requests.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /server
    schedule:
      interval: monthly
    ignore:
      # TypeScript 7 needs a TS6 alias for svelte-check and duplicates pi-ai types; revisit when tooling supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      server-deps:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /client
    schedule:
      interval: monthly
    ignore:
      # TypeScript 7 needs a TS6 alias for svelte-check and duplicates pi-ai types; revisit when tooling supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      client-deps:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /client/src-tauri
    schedule:
      interval: monthly
    groups:
      rust-deps:
        patterns: ["*"]
