name: Bug report
description: Something does not work as expected
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: Security problems must not be reported here. Use the private advisory form described in SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Where does it happen?
      options: [Server, Desktop app (Windows/macOS), Android app, iOS app, Web client, Not sure]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Settings → General, or `latest` build number
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / device
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens and API keys first.
